[workspace]
resolver = "2"
members = [
    "crates/aegis-classifier",
    "crates/aegis-bench",
    "crates/aegis-journal",
    "crates/aegis-sprt",
    "crates/aegis-replay",
    "crates/aegis-control",
    "crates/aegis-simulator",
    "crates/aegis-daemon",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
