name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegisfs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aegisfs/web/package-lock.json
      - name: Rust tests
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee cargo-test.log
      - name: Publish Rust diagnostics
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tail -c 60000 aegisfs/cargo-test.log > rust-diagnostics.log
          jq -n --arg name "Rust diagnostics ${{ github.run_number }}" \
            --arg sha "${{ github.sha }}" --rawfile text rust-diagnostics.log \
            '{name:$name,head_sha:$sha,status:"completed",conclusion:"neutral",output:{title:"Rust diagnostics",summary:"Compiler/test output for the Arena sandbox",text:$text}}' \
            | gh api -X POST repos/${{ github.repository }}/check-runs --input -
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: React production build
        run: npm ci && npm run build
        working-directory: aegisfs/web
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Publish generated Cargo lockfile
        if: success()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jq -n --arg name "Cargo lockfile ${{ github.run_number }}" \
            --arg sha "${{ github.sha }}" --rawfile text aegisfs/Cargo.lock \
            '{name:$name,head_sha:$sha,status:"completed",conclusion:"neutral",output:{title:"Generated Cargo.lock",summary:"Lockfile generated by cargo test",text:$text}}' \
            | gh api -X POST repos/${{ github.repository }}/check-runs --input -
