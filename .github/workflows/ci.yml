name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: aegisfs
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: aegisfs/web/package-lock.json
      - name: Rust tests
        run: |
          set -o pipefail
          cargo test --workspace 2>&1 | tee cargo-test.log
      - name: Publish Rust diagnostics
        if: failure()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/check-runs \
            -f name="Rust diagnostics ${{ github.run_number }}" \
            -f head_sha="${{ github.sha }}" \
            -f status=completed -f conclusion=neutral \
            -f output.title="Rust diagnostics" \
            -f output.summary="Compiler/test output for the Arena sandbox" \
            -f output.text="$(tail -c 60000 aegisfs/cargo-test.log)"
      - name: Rust formatting
        run: cargo fmt --all -- --check
      - name: React production build
        run: npm ci && npm run build
        working-directory: aegisfs/web
      - name: Python tests
        run: python3 -m unittest discover -s tests -v
      - name: Publish generated Cargo lockfile
        if: success()
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST repos/${{ github.repository }}/check-runs \
            -f name="Cargo lockfile ${{ github.run_number }}" \
            -f head_sha="${{ github.sha }}" \
            -f status=completed -f conclusion=neutral \
            -f output.title="Generated Cargo.lock" \
            -f output.summary="Lockfile generated by cargo test" \
            -f output.text="$(cat aegisfs/Cargo.lock)"
